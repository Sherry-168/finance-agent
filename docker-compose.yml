# 记账助手 · 一键启动
#   docker compose up --build
#   前端 http://localhost:7860   后端 http://localhost:8000/api/v1/health   接口文档 /docs
# 停止：docker compose down      连数据一起清空：docker compose down -v
#
# 数据持久化：宿主机 ./data ⇄ 容器 /app/data，SQLite 文件为 /app/data/finance.db，
# 容器重建 / 升级镜像都不会丢；data/sample_transactions.csv 也在这里，/demo/load 直接可用。
# 环境变量：compose 会自动读取同目录 .env（可缺省），未配置 LLM Key 也能启动，
# 只是解析走规则兜底、演示数据仍可完整体验。

name: finance-agent

x-app: &app
  build:
    context: .
  image: finance-agent:latest
  restart: unless-stopped

services:
  backend:
    <<: *app
    container_name: finance-agent-backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      # 容器内路径与外网端口都在此显式声明，避免依赖镜像默认值
      DB_PATH: /app/data/finance.db
      DEFAULT_USER_ID: ${DEFAULT_USER_ID:-demo_user}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com/v1}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      # 解析后端：openai = 直连模型；dify = 走李语琛的 Dify 工作流（验收项「可切 Dify」）
      # 注意：设为 dify 却忘了填 DIFY_API_KEY 时后端会自动回退 openai，不会启动失败
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      DIFY_API_KEY: ${DIFY_API_KEY:-}
      DIFY_BASE_URL: ${DIFY_BASE_URL:-https://api.dify.ai/v1}
      DIFY_INPUT_KEY: ${DIFY_INPUT_KEY:-user_input}
      # 语音转文字：云端 API（auto / agent / mock），镜像内绝不含本地模型
      ASR_PROVIDER: ${ASR_PROVIDER:-auto}
      ASR_API_KEY: ${ASR_API_KEY:-}
      ASR_BASE_URL: ${ASR_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      ASR_MODEL: ${ASR_MODEL:-glm-asr}
      ASR_MOCK_TEXT: ${ASR_MOCK_TEXT:-昨天打车 32 块}
      # 小票识别：api = 视觉模型（可一次识别多笔）
      OCR_PROVIDER: ${OCR_PROVIDER:-local}
      VISION_API_KEY: ${VISION_API_KEY:-}
      VISION_BASE_URL: ${VISION_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      VISION_MODEL: ${VISION_MODEL:-glm-4v-flash}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
      TZ: Asia/Shanghai
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    <<: *app
    container_name: finance-agent-frontend
    command: ["python", "frontend/app.py"]
    ports:
      - "7860:7860"
    environment:
      # 关键：容器内 localhost 指向容器自己，必须用服务名 backend 访问后端
      API_BASE_URL: http://backend:8000/api/v1
      FRONTEND_HOST: 0.0.0.0
      FRONTEND_PORT: "7860"
      MOCK_FALLBACK: ${MOCK_FALLBACK:-0}
      TZ: Asia/Shanghai
    depends_on:
      backend:
        condition: service_healthy
